name: Generate GitHub Stats

on:
  workflow_dispatch:

jobs:
  stats:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stats

          curl -fL "https://github-readme-stats.vercel.app/api?username=13eeCoder&show_icons=true&theme=tokyonight" \
            -o stats/github-stats.svg

          curl -fL "https://github-readme-stats.vercel.app/api/top-langs/?username=13eeCoder&layout=compact&theme=tokyonight" \
            -o stats/top-languages.svg

          file stats/github-stats.svg
          file stats/top-languages.svg

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          git diff --cached --quiet || git commit -m "Update GitHub stats"
          git push
